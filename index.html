<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#f1f5f9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AtteraVisual">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description"
    content="Attera Visual — manajemen pengantin, keuangan, dan penjadwalan tim untuk bisnis wedding photography profesional.">
  <meta property="og:description"
    content="Attera Visual — manajemen pengantin, keuangan, dan penjadwalan tim untuk bisnis wedding photography profesional.">
  <title>Attera Visual</title>
  <meta property="og:title" content="Attera Visual">
  <!-- Tailwind CSS loaded via build process -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Tenor+Sans&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Modernize Dashboard Colors */
      --color-bg: #f4f6f9;
      /* Modernize crisp light background */
      --color-surface: #ffffff;
      --color-text-light: #2a3547;
      /* Modernize dark navy charcoal */
      --color-text-primary: #2a3547;
      /* Slate charcoal */
      --color-text-secondary: #5a6a85;
      /* Modernize muted secondary */
      --color-accent: #5d87ff;
      /* Modernize signature primary blue */
      --color-accent-hover: #4570ea;
      --color-accent-light: #ecf2ff;
      /* Modernize primary tint */
      --color-accent-dark: #3a68e8;
      --color-accent-hsl: 224 100% 68%;
      --color-border: #eaeff4;
      /* Modernize soft clean border */
      --color-input-bg: #ffffff;
      --color-success: #13deb9;
      /* Modernize teal */
      --color-danger: #fa896b;
      /* Modernize coral */
      --color-warning: #ffae1f;
      /* Modernize amber */

      /* Public Pages (Portals, Forms) High-Contrast Defaults */
      --public-bg: #f4f6f9;
      --public-surface: #ffffff;
      --public-border: #eaeff4;
      --public-text-primary: #2a3547;
      --public-text-secondary: #5a6a85;
      --public-accent: #5d87ff;
      --public-accent-hover: #4570ea;
      --public-accent-hsl: 224 100% 68%;

      /* iOS Safe Area Variables */
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-inset-left: env(safe-area-inset-left, 0px);
      --safe-area-inset-right: env(safe-area-inset-right, 0px);

      color-scheme: light;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100%;
      font-family: 'Plus Jakarta Sans', 'Manrope', 'sans-serif';
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-touch-callout: none;
      /* Optimize scrolling for mobile */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      /* --- [UPDATED] Prevent horizontal scroll & hide vertical scrollbar --- */
      overflow-x: hidden;
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* IE and Edge */
    }

    /* iOS Safe Area Support */
    body.app-theme {
      /* [FIXED] Removed padding-top here because Header.tsx already handles it */
      padding-bottom: var(--safe-area-inset-bottom);
      padding-left: var(--safe-area-inset-left);
      padding-right: var(--safe-area-inset-right);
    }

    /* Desktop Typography (>= 768px) */
    @media (min-width: 768px) {
      .text-xs {
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .text-sm {
        font-size: 0.875rem;
        line-height: 1.4;
      }

      .text-base {
        font-size: 1rem;
        line-height: 1.5;
      }

      .text-lg {
        font-size: 1.125rem;
        line-height: 1.5;
      }

      .text-xl {
        font-size: 1.25rem;
        line-height: 1.4;
      }

      .text-2xl {
        font-size: 1.5rem;
        line-height: 1.3;
      }

      .text-3xl {
        font-size: 1.875rem;
        line-height: 1.2;
      }
    }

    /* Compact Mobile Typography (< 768px) - 1 Level Dikecilkan */
    @media (max-width: 767px) {
      .text-xs {
        font-size: 0.75rem;
        line-height: 1.35;
      }

      /* 12px */
      .text-sm {
        font-size: 0.84375rem;
        line-height: 1.4;
      }

      /* 13.5px */
      .text-base {
        font-size: 0.9375rem;
        line-height: 1.45;
      }

      /* 15px */
      .text-lg {
        font-size: 1rem;
        line-height: 1.45;
      }

      /* 16px */
      .text-xl {
        font-size: 1.125rem;
        line-height: 1.4;
      }

      /* 18px */
      .text-2xl {
        font-size: 1.25rem;
        line-height: 1.3;
      }

      /* 20px */
      .text-3xl {
        font-size: 1.5rem;
        line-height: 1.2;
      }

      /* 24px */

      /* Compact Mobile Buttons */
      .button-primary:not(.package-booking-button),
      .button-secondary:not(.package-booking-button) {
        min-height: 25px !important;
        height: auto !important;
        padding: 0.22rem 0.5rem !important;
        font-size: 0.58rem !important;
        line-height: 1.15 !important;
        border-radius: 6px !important;
        letter-spacing: 0 !important;
      }
    }

    /* Hide scrollbar for Chrome, Safari, and Opera */
    ::-webkit-scrollbar {
      display: none;
    }

    /* Enhanced Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounceSubtle {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-10px);
      }

      60% {
        transform: translateY(-5px);
      }
    }

    @keyframes pulseSoft {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Notification Animation Enhanced */
    @keyframes fadeInOut {
      0% {
        opacity: 0;
        transform: translateY(-20px) scale(0.95);
      }

      15% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      85% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-20px) scale(0.95);
      }
    }

    .animate-fade-in-out {
      animation: fadeInOut 3s ease-in-out forwards;
    }

    /* --- Text Gradient Enhanced --- */
    .text-gradient {
      background: linear-gradient(135deg, var(--public-accent), var(--public-accent-hover));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: gradient-shift 3s ease infinite;
    }

    body.app-theme .text-gradient {
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
    }

    @keyframes gradient-shift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    /* --- Enhanced Touch-Friendly Form Elements --- */
    .input-group {
      position: relative;
      min-width: 0;
    }

    /* Enhanced Input Fields with Touch Optimization */
    .input-field {
      display: block;
      width: 100%;
      min-height: 48px;
      /* Apple recommended minimum touch target */
      padding: 1.6rem 1rem 0.6rem;
      font-family: inherit;
      font-size: max(16px, 1rem);
      /* Prevent zoom on iOS */
      font-weight: 500;
      color: var(--color-text-light);
      background-color: var(--color-input-bg);
      border: 2px solid var(--color-border);
      border-radius: 12px;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      box-shadow: 0 0 0 0 transparent;
    }

    .input-field::placeholder {
      color: transparent;
    }

    /* Enhanced Focus State */
    .input-field:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 4px hsla(var(--color-accent-hsl), 0.15);
      transform: translateY(-1px);
    }

    /* Enhanced Floating Labels */
    .input-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 1rem;
      font-size: max(16px, 1rem);
      color: var(--color-text-secondary);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0 0.25rem;
      background-color: var(--color-input-bg);
      white-space: nowrap;
      max-width: calc(100% - 2rem);
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .input-field:focus+.input-label,
    .input-field:not(:placeholder-shown)+.input-label {
      top: 0;
      transform: translateY(-50%) scale(0.8);
      transform-origin: left;
      font-weight: 600;
      color: var(--color-accent);
      left: 0.75rem;
      max-width: calc(125% - 1.5rem);
    }

    label.input-label[class~="!static"],
    .input-label.form-label-static {
      position: static !important;
      display: inline-block;
      transform: none !important;
      max-width: 100%;
      margin-bottom: 0.5rem;
      padding: 0;
      background: transparent;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      line-height: 1.35;
      pointer-events: auto;
    }

    .input-field:not(:placeholder-shown):not(:focus)+.input-label {
      color: var(--color-text-secondary);
    }

    /* Enhanced Helper Text */
    .input-helper-text {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      padding: 0.5rem 1rem 0;
      line-height: 1.4;
    }

    /* Enhanced Textarea */
    textarea.input-field {
      height: auto;
      min-height: 120px;
      resize: vertical;
    }

    /* Enhanced Select */
    select.input-field {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 1rem center;
      background-repeat: no-repeat;
      background-size: 1.25em 1.25em;
      padding-right: 3rem;
    }

    /* Enhanced Checkbox & Radio */
    input[type="checkbox"],
    input[type="radio"] {
      width: 14px;
      height: 14px;
      min-width: 14px;
      min-height: 14px;
      border-radius: 3px;
      color: var(--color-accent);
      border: 1.5px solid var(--color-text-secondary);
      background-color: transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    input[type="radio"] {
      border-radius: 50%;
    }

    input[type="checkbox"]:checked,
    input[type="radio"]:checked {
      border-color: var(--color-accent);
      background-color: var(--color-accent);
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
    }

    /* Mobile optimization for checkbox */
    @media (max-width: 768px) {

      input[type="checkbox"],
      input[type="radio"] {
        width: 11px;
        height: 11px;
        min-width: 11px;
        min-height: 11px;
        border-radius: 2px;
        border-width: 1px;
      }
    }

    /* Extra small mobile */
    @media (max-width: 480px) {

      input[type="checkbox"],
      input[type="radio"] {
        width: 10px;
        height: 10px;
        min-width: 10px;
        min-height: 10px;
        border-radius: 2px;
        border-width: 1px;
      }
    }

    /* Enhanced Date Input */
    input[type="date"] {
      font-size: max(16px, 1rem);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.6;
      filter: invert(var(--dark-mode-filter, 0));
      transition: opacity 0.2s;
      width: 20px;
      height: 20px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* --- Enhanced Input with Icon --- */
    .input-with-icon {
      position: relative;
      min-width: 0;
    }

    .input-with-icon input {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 0 1rem 0 3.25rem !important;
      line-height: 48px;
      font-family: inherit;
      font-size: max(16px, 1rem);
      font-weight: 500;
      color: var(--color-text-light);
      background-color: var(--color-input-bg);
      border: 2px solid var(--color-border);
      border-radius: 12px;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    .input-with-icon .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-secondary);
      pointer-events: none;
      width: 20px;
      height: 20px;
      z-index: 2;
    }

    .input-with-icon input::placeholder {
      color: var(--color-text-secondary);
      opacity: 1;
    }

    .input-with-icon input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 4px hsla(var(--color-accent-hsl), 0.15);
      transform: translateY(-1px);
    }

    /* --- Enhanced Button Styles --- */
    .button-primary {
      font-weight: 600;
      min-height: 40px;
      padding: 0.6rem 1.25rem;
      font-size: 0.875rem;
      border-radius: 12px;
      color: white;
      text-transform: none;
      letter-spacing: normal;
      border: none;
      background: linear-gradient(135deg, var(--color-accent-light), var(--color-accent));
      box-shadow: 0 4px 15px -3px hsla(var(--color-accent-hsl), 0.4), 0 2px 8px -2px hsla(var(--color-accent-hsl), 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
    }

    .button-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s;
    }

    .button-primary:hover {
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
      box-shadow: 0 8px 25px -3px hsla(var(--color-accent-hsl), 0.5), 0 4px 12px -2px hsla(var(--color-accent-hsl), 0.4);
      transform: translateY(-2px) scale(1.02);
    }

    .button-primary:hover::before {
      left: 100%;
    }

    .button-primary:active {
      transform: translateY(-1px) scale(0.98);
      box-shadow: 0 4px 15px -3px hsla(var(--color-accent-hsl), 0.4);
      transition: all 0.1s ease;
    }

    .button-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      background: linear-gradient(135deg, var(--color-accent-light), var(--color-accent));
    }

    .button-secondary {
      font-weight: 600;
      min-height: 40px;
      padding: 0.6rem 1.25rem;
      border-radius: 12px;
      font-size: 0.875rem;
      letter-spacing: normal;
      text-transform: none;
      background-color: var(--color-input-bg);
      color: #475569;
      border: 2px solid var(--color-border);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .button-secondary:hover {
      color: #1e293b;
      background-color: #e2e8f0;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.1);
    }

    .button-secondary:active {
      background-color: #cbd5e1;
      color: #1e293b;
      transform: translateY(0);
    }

    .button-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* --- Enhanced Widget Animation --- */
    @keyframes widget-fade-in-up {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .widget-animate {
      animation: widget-fade-in-up 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      opacity: 0;
    }

    /* Timeline Line Animation Enhanced */
    @keyframes draw-line-ver {
      from {
        transform: scaleY(0);
        opacity: 0.5;
      }

      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    /* --- Enhanced Mobile Navigation --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--color-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 -4px 20px -4px rgba(0, 0, 0, 0.1);
      z-index: 50;
      border-top: 1px solid var(--color-border);
      padding-bottom: var(--safe-area-inset-bottom);
      /* Enhance touch responsiveness */
      min-height: calc(64px + var(--safe-area-inset-bottom));
    }

    .bottom-nav button {
      min-height: 48px;
      min-width: 48px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .bottom-nav button:active {
      transform: scale(0.95);
      background-color: var(--color-input-bg);
    }

    /* --- Enhanced Public Pages Styles --- */
    .public-page-body {
      background-color: var(--public-bg);
      color: var(--public-text-primary);
      font-family: 'Manrope', 'sans-serif';
    }

    .public-page-body .button-primary {
      background: linear-gradient(135deg, var(--public-accent), var(--public-accent-hover));
      box-shadow: 0 4px 15px -3px hsla(var(--public-accent-hsl), 0.4), 0 2px 8px -2px hsla(var(--public-accent-hsl), 0.3);
    }

    .public-page-body .button-secondary {
      background-color: var(--public-surface);
      color: var(--public-text-secondary);
      border-color: var(--public-border);
    }

    .public-page-body .input-field {
      background-color: var(--public-surface);
      border-color: var(--public-border);
      color: var(--public-text-primary);
    }

    .public-page-body .input-field:focus {
      border-color: var(--public-accent);
      box-shadow: 0 0 0 4px hsla(var(--public-accent-hsl), 0.15);
    }

    .public-page-body .input-label {
      background-color: var(--public-surface);
      color: var(--public-text-secondary);
    }

    .public-page-body .input-field:focus+.input-label,
    .public-page-body .input-field:not(:placeholder-shown)+.input-label {
      color: var(--public-accent);
    }

    /* Enhanced Timeline */
    .timeline-item {
      position: relative;
      padding-left: 2.5rem;
      padding-bottom: 2rem;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 24px;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--public-accent), var(--public-border));
      transform-origin: top;
      animation: draw-line-ver 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
      animation-delay: var(--animation-delay, 0s);
    }

    .timeline-item:last-child::before {
      display: none;
    }

    .timeline-icon-container {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      z-index: 10;
      background-color: var(--public-bg);
      box-shadow: 0 0 0 3px var(--public-accent);
      transition: all 0.3s ease;
    }

    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 hsla(var(--public-accent-hsl), 0.7);
      }

      70% {
        box-shadow: 0 0 0 15px hsla(var(--public-accent-hsl), 0);
      }

      100% {
        box-shadow: 0 0 0 0 hsla(var(--public-accent-hsl), 0);
      }
    }

    .timeline-icon-container.active-pulse {
      animation: pulse-ring 2s infinite;
    }

    /* --- Enhanced Responsive Document Tables --- */
    @media screen and (max-width: 640px) {
      .printable-content .responsive-table thead {
        display: none;
      }

      .printable-content .responsive-table tr {
